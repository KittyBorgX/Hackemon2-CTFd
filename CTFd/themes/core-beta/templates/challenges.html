{% extends "base.html" %}

{% block stylesheets %}
{{ super() }}
<style>
    body { background: var(--poke-bg) !important; }

    .jumbotron {
        background: var(--poke-dark) !important;
        border-bottom: 4px solid var(--poke-yellow);
        padding: 2.5rem 1rem;
    }
    .jumbotron h1 {
        color: var(--poke-yellow) !important;
        text-shadow: 3px 3px 0 var(--poke-blue) !important;
        font-size: 1.5rem !important;
    }
    .jumbotron p { color: rgba(255,255,255,0.9) !important; }

    .category-header h3 {
        font-family: var(--poke-font) !important;
        color: var(--poke-dark) !important;
        border-bottom: 3px solid var(--poke-dark);
        display: inline-block;
        padding-bottom: 4px;
        font-size: 0.85rem !important;
    }

    .challenge-card {
        background: var(--poke-panel);
        border: var(--pixel-border);
        border-radius: 0 !important;
        text-align: center;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        box-shadow: var(--pixel-shadow);
        color: var(--poke-dark);
    }
    .challenge-card:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 var(--poke-dark);
        border-color: var(--poke-red);
    }
    .challenge-card.challenge-solved {
        border-color: var(--poke-yellow);
        box-shadow: 4px 4px 0 var(--poke-yellow);
    }

    .challenge-inner { padding: 1.2rem; }

    .challenge-card-title {
        font-family: var(--poke-font) !important;
        font-size: 0.65rem !important;
        color: var(--poke-dark);
        margin-bottom: 0.5rem;
        line-height: 1.6;
    }
    .challenge-card-cp {
        font-family: var(--poke-font) !important;
        font-size: 0.75rem !important;
        color: var(--poke-red);
        margin-bottom: 0.3rem;
    }

    .pokemon-sprite-container { margin-top: 0.5rem; }
    .pokemon-sprite {
        width: 64px;
        height: 64px;
        object-fit: contain;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
    }

    .solved-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(26,26,46,0.88);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--poke-yellow);
        font-family: var(--poke-font);
        font-size: 0.7rem;
        letter-spacing: 2px;
        opacity: 0;
        transition: opacity 0.25s ease;
    }
    .challenge-solved .solved-overlay { opacity: 1; }

    .pokeball-icon {
        width: 48px;
        height: 48px;
        background: url('{{ url_for("views.themes", path="img/Poke_Ball..png") }}') center/contain no-repeat;
        margin-bottom: 0.5rem;
        image-rendering: pixelated;
    }
    @keyframes pokeball-wobble {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(12deg); }
        75% { transform: rotate(-12deg); }
    }
    .challenge-solved:hover .pokeball-icon { animation: pokeball-wobble 0.6s ease-in-out; }
</style>
{% endblock %}

{% block content %}
<div class="jumbotron">
    <div class="container">
        <h1>Challenge Arena</h1>
        <p class="lead">Prove your skills and become the HACKEMON Master!</p>
    </div>
</div>

<div class="container">
    <div class="row">
        <div class="col-md-12">
            {% include "components/errors.html" %}
        </div>
    </div>

    <div x-data="ChallengeBoard" @load-challenges.window="loadChallenges()" @load-challenge.window="loadChallenge($event.detail)">
        <div x-ref="challengeWindow" id="challenge-window" class="modal fade" tabindex="-1" role="dialog" x-data x-html="$store.challenge.data.view"></div>

        <div x-show="!loaded">
            <div class="min-vh-50 d-flex align-items-center">
                <div class="text-center w-100">
                    <i class="fas fa-circle-notch fa-spin fa-3x fa-fw spinner"></i>
                </div>
            </div>
        </div>

        <div x-show="loaded">
            <template x-for="(category, idx) in getCategories()" :key="idx">
                <div class="pt-5">
                    <div class="category-header mb-3">
                        <h3 x-text="category"></h3>
                    </div>
                    <div class="challenges-row row">
                        <template x-for="c in getChallenges(category)" :key="c.id">
                            <div class="col-sm-6 col-md-4 col-lg-3 my-3">
                                <div class="challenge-card"
                                    :class="{ 'challenge-solved': c.solved_by_me }"
                                    @click="loadChallenge(c.id)">
                                    <div class="challenge-inner">
                                        <h4 class="challenge-card-title" x-text="c.name"></h4>
                                        <p class="challenge-card-cp">CP <span x-text="c.value"></span></p>
                                        <div x-data="{ pokemonId: Math.floor(Math.random() * 898) + 1 }" class="pokemon-sprite-container">
                                            <img :src="`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemonId}.png`" alt="Pokemon" class="pokemon-sprite">
                                        </div>
                                    </div>
                                    <div x-show="c.solved_by_me" class="solved-overlay">
                                        <div class="pokeball-icon"></div>
                                        <span>CAUGHT!</span>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
  {{ Assets.js("assets/js/challenges.js") }}
{% endblock %}
