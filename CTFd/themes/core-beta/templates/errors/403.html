{% extends "base.html" %}

{% block content %}
<div class="container" style="padding-top: 5rem; padding-bottom: 5rem;">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="pixel-box p-4">
                <p class="pixel-box-label">ACCESS DENIED</p>
                <h1 style="color: var(--poke-red); font-size: 3rem !important; text-shadow: 4px 4px 0 var(--poke-dark); margin-bottom: 1rem;">403</h1>
                <h2 style="color: var(--poke-dark); margin-bottom: 1rem;">{{ error }}</h2>
                <p style="font-family: 'Courier New', monospace; font-size: 1rem; color: var(--poke-dark); line-height: 1.7; margin-bottom: 2rem;">
                    {% trans %}403 Forbidden{% endtrans %} — You don't have the badge for this area, Trainer!
                </p>
                <a href="/" class="btn btn-pokemon-yellow">▶ Return to Base</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
