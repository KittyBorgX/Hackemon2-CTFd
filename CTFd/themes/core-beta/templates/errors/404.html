{% extends "base.html" %}

{% block content %}
<div class="container" style="padding-top: 5rem; padding-bottom: 5rem;">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="pixel-box p-4">
                <p class="pixel-box-label">ERROR</p>
                <h1 style="color: var(--poke-red); font-size: 3rem !important; text-shadow: 4px 4px 0 var(--poke-dark); margin-bottom: 1rem;">404</h1>
                <h2 style="color: var(--poke-dark); margin-bottom: 1.5rem;">A wild page appeared!</h2>
                <p style="font-family: 'Courier New', monospace; font-size: 1rem; color: var(--poke-dark); line-height: 1.7; margin-bottom: 2rem;">
                    The page you're looking for fled into the tall grass.<br>
                    {% trans %}File not found{% endtrans %}.
                </p>
                <div class="hp-bar" style="max-width: 200px; margin: 0 auto 1.5rem;">
                    <div class="hp-bar-fill low" style="width: 10%;"></div>
                </div>
                <a href="/" class="btn btn-pokemon-yellow">
                    ▶ Return to Base
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
